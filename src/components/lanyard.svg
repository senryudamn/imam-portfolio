<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <!-- 1. Background Base (Sangat Gelap) -->
  <rect width="1200" height="120" fill="#020617" />
  
  <!-- 2. Tekstur Serat Karbon / Kain Tali Lanyard -->
  <defs>
    <pattern id="carbon" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0f172a" stroke-width="4" />
    </pattern>
    <!-- Efek Gradasi untuk Pinggiran Tali -->
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#carbon)" />

  <!-- 3. Pinggiran Tali Bercahaya (Top & Bottom Edges) -->
  <rect width="1200" height="6" fill="url(#glow)" />
  <rect y="114" width="1200" height="6" fill="url(#glow)" />

  <!-- 4. Garis Tengah Pembagi (Putus-putus Industrial) -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#047857" stroke-width="1" stroke-dasharray="20 10" opacity="0.4"/>

  <!-- ================= BLOCK 1 ================= -->
  <g transform="translate(60, 0)">
    <!-- Teks Utama -->
    <text x="0" y="52" font-family="'Courier New', monospace" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="2">IMAM<tspan fill="#10b981">.DEV</tspan></text>
    <text x="2" y="88" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#94a3b8" letter-spacing="5">MECHATRONICS</text>
    
    <!-- Elemen Barcode IoT -->
    <path d="M 290 30 v 40 m 8 -40 v 40 m 5 -40 v 40 m 12 -40 v 40 m 4 -40 v 40 m 10 -40 v 40 m 7 -40 v 40" stroke="#10b981" stroke-width="3" opacity="0.8" />
    <text x="290" y="90" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#047857">SYS_ID: 0x42</text>
  </g>

  <!-- ================= CIRCUIT TRACES (Penghubung) ================= -->
  <path d="M 450 20 h 60 l 20 20 h 40" fill="none" stroke="#047857" stroke-width="3"/>
  <circle cx="570" cy="40" r="4" fill="#10b981"/>
  
  <path d="M 480 100 h 40 l 15 -15 h 55" fill="none" stroke="#047857" stroke-width="2" opacity="0.6"/>
  <circle cx="590" cy="85" r="3" fill="#047857"/>

  <!-- ================= BLOCK 2 ================= -->
  <g transform="translate(670, 0)">
    <!-- Ornamen Node Sebelum Teks -->
    <path d="M -70 60 l 15 -15 h 25 l 10 15 h -50" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="-45" cy="45" r="3" fill="#f8fafc"/>
    <circle cx="-20" cy="60" r="3" fill="#f8fafc"/>

    <!-- Teks Utama -->
    <text x="0" y="52" font-family="'Courier New', monospace" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="2">ENGINEER<tspan fill="#10b981">_</tspan></text>
    <text x="2" y="88" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#94a3b8" letter-spacing="5">AUTOMATION_IOT</text>
    
    <!-- Elemen Barcode Hardware -->
    <path d="M 330 30 v 40 m 6 -40 v 40 m 10 -40 v 40 m 5 -40 v 40 m 12 -40 v 40 m 5 -40 v 40 m 8 -40 v 40" stroke="#10b981" stroke-width="3" opacity="0.8" />
    <text x="330" y="90" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#047857">NODE_01: ACTV</text>
  </g>

  <!-- ================= CIRCUIT TRACES (Ujung Kanan) ================= -->
  <path d="M 1080 30 h 40 l 20 20 h 60" fill="none" stroke="#047857" stroke-width="3"/>
  <circle cx="1200" cy="50" r="4" fill="#10b981"/>
</svg>
